name: Backtest des alertes

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scanner
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Rejouer les alertes
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          EXCHANGE: okx
          SINCE_UTC: ""
        run: python backtest_alerts.py

      - name: Enregistrer les résultats
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add backtest_results.csv backtest_summary.txt
          git diff --staged --quiet || (git commit -m "backtest results" && git pull --rebase && git push)
