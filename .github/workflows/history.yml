name: Rejeu historique

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Nombre de jours d'historique"
        default: "60"
      max_pairs:
        description: "Nombre de paires (les plus liquides d'abord)"
        default: "60"
      timeframes:
        description: "Timeframes"
        default: "15m,1h"
      impulse_atr:
        description: "Seuil d'impulsion en ATR (vide = réglage actuel, 2.5)"
        default: ""
      min_rr:
        description: "R/R minimum (vide = réglage actuel, 2)"
        default: ""

permissions:
  contents: write

concurrency:
  group: history
  cancel-in-progress: false

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Rejouer l'historique
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          EXCHANGE: okx
          DAYS: ${{ inputs.days }}
          MAX_PAIRS: ${{ inputs.max_pairs }}
          TIMEFRAMES: ${{ inputs.timeframes }}
          IMPULSE_ATR: ${{ inputs.impulse_atr }}
          MIN_RR: ${{ inputs.min_rr }}
        run: python backtest_history.py

      - name: Enregistrer les résultats
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add history_results.csv history_summary.txt
          git diff --staged --quiet || (git commit -m "history results" && git pull --rebase && git push)
